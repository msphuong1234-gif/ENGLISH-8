function key(si,pi,qi){return `anh8_${si}_${pi}_${qi}`}
function normalize(s){return String(s||'').toLowerCase().normalize('NFKC').replace(/[’‘]/g,"'").replace(/i'm/g,'i am').replace(/isn't/g,'is not').replace(/aren't/g,'are not').replace(/doesn't/g,'does not').replace(/[“”".,!?;:()]/g,' ').replace(/\s+/g,' ').trim()}
function variants(ans){let base=[ans]; const slash=/([A-Za-z]+)\/([A-Za-z]+)/; let changed=true; while(changed){changed=false;let next=[];for(const x of base){const m=x.match(slash);if(m){changed=true;next.push(x.replace(m[0],m[1]),x.replace(m[0],m[2]));}else next.push(x)}base=[...new Set(next)]} return base.map(normalize)}
function correct(user,ans){const u=normalize(user);return u && variants(ans).includes(u)}

function openPart(pi){currentPart=pi;const s=DATA.sets[currentSet],p=s.parts[pi];let h=`<div class="topbar"><div class="crumb">${esc(s.title)} › ${esc(p.title)}</div><div class="actions"><button class="btn secondary" onclick="openSet(${currentSet})">← Chọn phần khác</button><button class="btn secondary" onclick="renderHome()">Trang chính</button></div></div><div id="questions">`;p.questions.forEach((q,qi)=>{const saved=localStorage.getItem(key(currentSet,pi,qi))||'';const multi=(pi>=2);h+=`<div class="qcard" data-q="${qi}"><div class="qhead"><div class="num">${qi+1}</div><div class="qtext">${esc(q.q)}</div></div>${multi?`<textarea class="answer-input" data-i="${qi}" placeholder="Nhập câu trả lời đầy đủ...">${esc(saved)}</textarea>`:`<input class="answer-input" data-i="${qi}" value="${esc(saved)}" placeholder="Nhập đáp án...">`}<div class="result" id="res_${qi}"></div></div>`});h+=`</div><div class="submitbar"><div><div class="scorebox" id="score">Chưa nộp bài</div><div class="meta" id="completion"></div></div><div class="actions"><button class="btn danger" onclick="resetPart()">Làm lại phần</button><button class="btn teal" onclick="submitPart()">Nộp bài</button></div></div>`;$('#partview').innerHTML=h;document.querySelectorAll('.answer-input').forEach(el=>el.addEventListener('input',()=>{localStorage.setItem(key(currentSet,pi,el.dataset.i),el.value);updateCompletion()}));updateCompletion();show('partview')}
function updateCompletion(){const p=DATA.sets[currentSet].parts[currentPart];let n=0;document.querySelectorAll('.answer-input').forEach(x=>{if(x.value.trim())n++});$('#completion').textContent=`Đã trả lời ${n}/${p.questions.length} câu`;}
function submitPart(){const p=DATA.sets[currentSet].parts[currentPart];const ins=[...document.querySelectorAll('.answer-input')];let blanks=ins.filter(x=>!x.value.trim()).length;if(blanks&&!confirm(`Bạn còn ${blanks} câu chưa trả lời. Vẫn nộp bài?`))return;let score=0;ins.forEach((el,i)=>{const q=p.questions[i],ok=correct(el.value,q.answer);if(ok)score++;const r=$('#res_'+i);r.classList.add('show');r.innerHTML=`<div class="status ${ok?'ok':'bad'}">${ok?'✓ Đúng':'✗ Chưa đúng'}</div><div class="detail"><div class="orig"><b>Đề gốc:</b> ${esc(q.q)}</div><div><b>Bài làm của em:</b> ${esc(el.value||'—')}</div><div><b>Đáp án:</b> ${esc(q.answer)}</div>${q.meaning?`<div><b>Dịch nghĩa:</b> ${esc(q.meaning)}</div>`:''}${q.knowledge?`<div><b>Kiến thức phải nhớ:</b> ${esc(q.knowledge)}</div>`:''}${q.explanation?`<div><b>Giải thích / cách làm:</b> ${esc(q.explanation)}</div>`:''}${q.error?`<div><b>Lỗi dễ mắc:</b> ${esc(q.error)}</div>`:''}</div>`});$('#score').innerHTML=`Kết quả: <strong>${score}/${p.questions.length}</strong> · ${Math.round(score/p.questions.length*100)}%`;toast('Đã chấm xong phần này');window.scrollTo({top:0,behavior:'smooth'})}
function resetPart(){if(!confirm('Xóa toàn bộ câu trả lời của phần này để làm lại?'))return;const p=DATA.sets[currentSet].parts[currentPart];p.questions.forEach((_,i)=>localStorage.removeItem(key(currentSet,currentPart,i)));openPart(currentPart);toast('Đã xóa bài làm của phần này')}
renderHome();
</script></body></html>
